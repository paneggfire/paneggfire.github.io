<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIM DONG HYEON — Video Editor</title>
<meta name="description" content="영상 편집자 김동현의 포트폴리오. 2D, AI 모션, 3D 아나몰픽, AI 이미지.">
<meta property="og:title" content="KIM DONG HYEON — Video Editor">
<meta property="og:description" content="영상 편집자 김동현. 영상 편집, 모션, 이미지.">
<meta property="og:image" content="assets/works/tenjiku-2.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ================================================================
   색상과 글꼴 — 여기만 바꾸면 사이트 전체 분위기가 바뀝니다
   ================================================================ */
:root{
  --paper:#F6F7F3;      /* 바탕 */
  --ink:#16181A;        /* 글자 */
  --muted:#6B6F6A;      /* 보조 글자 */
  --line:#D9DCD4;       /* 구분선 */
  --signal:#2F3BFF;     /* 포인트 (LED 블루) */
  --night:#0E1013;      /* 쇼릴·썸네일 바탕 */
  --font-display:"Archivo", system-ui, sans-serif;
  --font-body:"Noto Sans KR", "Archivo", system-ui, sans-serif;
  --gutter:clamp(16px, 4vw, 56px);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7;overflow-x:hidden;word-break:keep-all}
img,video,iframe{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px}

/* ---------- 상단 메뉴 ---------- */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;justify-content:space-between;align-items:center;
  padding:18px var(--gutter);mix-blend-mode:difference;color:#fff;pointer-events:none}
.nav a{pointer-events:auto;text-decoration:none}
.nav .mark{font-family:var(--font-display);font-weight:800;font-stretch:125%;letter-spacing:.02em;font-size:15px}
.nav ul{display:flex;gap:clamp(14px,3vw,36px);list-style:none;font-family:var(--font-display);font-size:14px;font-weight:500}
.nav ul a{opacity:.75;transition:opacity .2s}
.nav ul a:hover{opacity:1}

/* ---------- HOME: 글자 속에서 영상(또는 이미지)이 보이는 히어로 ---------- */
.hero{position:relative;height:200svh}
.hero-stage{position:sticky;top:0;height:100svh;overflow:hidden}
.hero-media{position:absolute;inset:0;background:
  radial-gradient(60% 80% at 20% 30%, #ff7a3d 0%, transparent 60%),
  radial-gradient(50% 70% at 80% 60%, #2f3bff 0%, transparent 65%),
  radial-gradient(40% 60% at 55% 20%, #18d6c5 0%, transparent 60%),
  #1b1030;background-size:200% 200%;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{0%{background-position:0% 0%}100%{background-position:100% 100%}}
.hero-media img,.hero-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-media img{animation:pan 18s ease-in-out infinite alternate}
@keyframes pan{0%{transform:scale(1.08) translateX(-2%)}100%{transform:scale(1.08) translateX(2%)}}
.hero-mask{position:absolute;inset:0;background:var(--paper);mix-blend-mode:screen;
  display:flex;align-items:center;justify-content:center;will-change:transform,opacity}
.hero-word{font-family:var(--font-display);font-weight:900;font-stretch:125%;color:#000;
  font-size:clamp(64px, 21vw, 420px);line-height:.8;letter-spacing:-.04em;user-select:none;white-space:nowrap}
.hero-meta{position:absolute;left:var(--gutter);right:var(--gutter);bottom:clamp(20px,4vh,44px);
  display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;will-change:opacity}
.hero-meta h1{font-family:var(--font-display);font-weight:700;font-size:clamp(18px,2vw,26px);line-height:1.2;letter-spacing:.01em}
.hero-meta h1 span{display:block;font-weight:400;color:var(--muted);font-size:.72em;margin-top:6px}
.hero-meta ul{list-style:none;display:flex;gap:18px;font-family:var(--font-display);font-size:14px;color:var(--muted)}

/* ---------- 공통 섹션 ---------- */
section.block{padding:clamp(80px,12vw,160px) var(--gutter)}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:clamp(28px,4vw,48px)}
.block-head h2{font-family:var(--font-display);font-weight:800;font-stretch:118%;font-size:clamp(36px,6vw,84px);line-height:.95;letter-spacing:-.02em}

/* ---------- WORKS ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font-size:14px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;transition:background .2s,color .2s,border-color .2s}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters button .n{font-family:var(--font-display);opacity:.55;margin-left:4px;font-size:12px}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(28px,3.5vw,48px) clamp(14px,2vw,28px)}
.work{grid-column:span 6;text-align:left;display:flex;flex-direction:column;gap:12px}
.work.tall{grid-column:span 4}
.work.wide{grid-column:span 8}
.work[hidden]{display:none}
.thumb{position:relative;overflow:hidden;aspect-ratio:16/9;background:var(--night);border-radius:2px}
.work.tall .thumb{aspect-ratio:4/5}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.work:hover .thumb img,.work:hover .thumb video{transform:scale(1.03)}
.thumb .count{position:absolute;right:10px;bottom:10px;font-family:var(--font-display);font-size:12px;color:#fff;
  background:rgba(0,0,0,.5);padding:2px 8px;border-radius:999px}
.work-cap{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.work-cap strong{font-weight:700;font-size:17px}
.work-cap small{font-family:var(--font-display);color:var(--muted);font-size:13px;white-space:nowrap}
.work-cat{font-size:13px;color:var(--muted);margin-top:-8px}

/* ---------- SHOWREEL ---------- */
#showreel{background:var(--night);color:#F2F3EF}
#showreel .block-head{border-color:#2a2d31}
#showreel .block-head p{color:#9a9f99;font-size:14px}
.reel{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.reel iframe,.reel video{position:absolute;inset:0;width:100%;height:100%;border:0}
.reel .empty{position:absolute;inset:0;display:grid;place-items:center;color:#6d726c;font-size:14px;text-align:center;padding:20px}

/* ---------- ABOUT ---------- */
.about{display:grid;grid-template-columns:5fr 7fr;gap:clamp(32px,6vw,96px)}
.about-side img{width:min(100%,360px);height:auto}
.about-lead{font-size:clamp(24px,3vw,40px);line-height:1.35;font-weight:700;letter-spacing:-.02em;margin-top:28px;max-width:12em}
.about-body > p{max-width:34em;color:#3b3f3c;margin-bottom:1.1em;font-size:17px}
.facts{display:grid;grid-template-columns:7em 1fr;gap:12px 20px;margin:36px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:14px;padding-top:2px}
.facts dd{font-weight:500}
.sub{margin-top:56px}
.sub h3{font-size:14px;font-weight:500;color:var(--muted);margin-bottom:14px}
.tools{list-style:none;border-top:1px solid var(--line)}
.tools li{display:grid;grid-template-columns:1fr auto;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink)}
.dots i.on{background:var(--ink)}
.certs{list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.certs li{border:1px solid var(--line);padding:8px 14px;font-size:15px}
.exp h4{font-size:20px;font-weight:700}
.exp .when{font-size:14px;color:var(--muted);margin:2px 0 10px}
.exp p{max-width:34em;color:#3b3f3c}
.exp ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.exp ul li{font-size:14px;background:#E9EBE5;padding:4px 12px;border-radius:999px}
.contact a.mail{font-family:var(--font-display);font-weight:700;font-size:clamp(22px,3vw,40px);text-decoration:none;word-break:break-all;
  background:linear-gradient(var(--signal),var(--signal)) 0 100%/0 2px no-repeat;transition:background-size .35s}
.contact a.mail:hover{background-size:100% 2px}
.contact .links{display:flex;gap:20px;margin-top:14px}
.contact .links a{font-weight:500;font-size:14px;color:var(--muted)}

footer{padding:28px var(--gutter);border-top:1px solid var(--line);display:flex;justify-content:space-between;
  font-size:13px;color:var(--muted);font-family:var(--font-display)}

/* ---------- 작품 상세 팝업 ---------- */
dialog.viewer{border:0;padding:0;width:min(1100px,94vw);max-height:92svh;overflow:auto;overscroll-behavior:contain;
  background:var(--paper);color:var(--ink);margin:auto;border-radius:2px}
dialog.viewer::backdrop{background:rgba(14,16,19,.88)}
.viewer-close{position:sticky;top:10px;float:right;margin:10px 10px -50px 0;z-index:2;width:40px;height:40px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:22px;line-height:40px}
.viewer-video{position:relative;aspect-ratio:16/9;background:#000}
.viewer-video.vertical{aspect-ratio:9/16;max-height:80svh;margin:0 auto}
.viewer-video iframe,.viewer-video video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain}
.viewer-head{padding:28px clamp(18px,3vw,40px) 8px}
.viewer-head h3{font-size:clamp(24px,3vw,34px);font-weight:700;line-height:1.25}
.viewer-head .tagline{color:var(--muted);margin-top:4px}
.viewer-body{display:grid;grid-template-columns:1fr 15em;gap:24px 48px;padding:16px clamp(18px,3vw,40px) 28px}
.viewer-body p{max-width:38em;color:#3b3f3c;margin-bottom:.8em}
.viewer-body dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;align-content:start}
.viewer-body dt{color:var(--muted)}
.steps{list-style:none;counter-reset:s;margin-top:12px;border-top:1px solid var(--line)}
.steps li{counter-increment:s;display:grid;grid-template-columns:2.2em 1fr;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--font-display);color:var(--muted);font-size:14px;padding-top:2px}
.gallery{display:grid;gap:14px;padding:0 clamp(18px,3vw,40px) clamp(24px,4vw,40px)}
.gallery.row{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-items:start}
.gallery figure{margin:0}
.gallery img{width:100%;height:auto;max-height:80svh;object-fit:contain;margin:0 auto}
.gallery figcaption{font-size:14px;color:var(--muted);padding:8px 2px 0;background:var(--paper)}

/* ---------- 모바일 ---------- */
@media (max-width:820px){
  .work,.work.tall,.work.wide{grid-column:span 12}
  .about,.viewer-body{grid-template-columns:1fr}
  .nav ul{gap:14px;font-size:13px}
}
@media (max-width:480px){ .nav .mark{font-size:13px} }
@media (max-width:700px){ .hero-word span{display:block} .hero-word{line-height:.86;text-align:center} }
@media (prefers-reduced-motion:reduce){
  .hero{height:100svh}
  .hero-media,.hero-media img{animation:none}
  html{scroll-behavior:auto}
}
</style>
</head>

/* ================================================================
   아래부터는 사이트 동작 코드 — 수정하지 않아도 됩니다
   ================================================================ */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* 영상 주소 → 재생 요소 */
function videoFor(src, autoplay = false) {
  if (!src) return null;
  if (src.startsWith("youtube:") || src.startsWith("vimeo:")) {
    const yt = src.startsWith("youtube:");
    const id = src.split(":")[1];
    const f = document.createElement("iframe");
    f.src = yt ? `https://www.youtube-nocookie.com/embed/${id}?rel=0${autoplay ? "&autoplay=1" : ""}`
               : `https://player.vimeo.com/video/${id}?dnt=1${autoplay ? "&autoplay=1" : ""}`;
    f.allow = "autoplay; fullscreen; picture-in-picture"; f.allowFullscreen = true; f.title = "영상";
    return f;
  }
  const v = document.createElement("video");
  v.src = src; v.controls = true; v.playsInline = true; v.autoplay = autoplay;
  return v;
}

/* ---------- 브랜드 이름 ---------- */
document.querySelectorAll("[data-brand]").forEach(el => el.textContent = SITE.brand);
$("#heroWord").innerHTML = SITE.brand.split(" ").map(w => `<span>${esc(w)}</span>`).join(" "); // 좁은 화면에서는 단어별로 줄바꿈
document.title = `${SITE.brand} — ${SITE.role}`;
$("#roleText").textContent = SITE.role;

/* ---------- WORKS ---------- */
const grid = $("#grid"), filters = $("#filters");

PROJECTS.forEach(p => {
  const b = document.createElement("button");
  b.className = "work" + (p.size ? " " + p.size : "");
  b.dataset.cat = p.category;
  const count = (p.images?.length || 0) + (p.video ? 1 : 0);
  b.innerHTML = `
    <div class="thumb"><img src="${esc(p.thumb)}" alt="" loading="lazy">${count > 1 ? `<span class="count">${count}</span>` : ""}</div>
    <div class="work-cap"><strong>${esc(p.title)}</strong><small>${esc(p.year)}</small></div>
    <div class="work-cat">${esc(CATEGORIES[p.category])}${p.tagline ? ", " + esc(p.tagline) : ""}</div>`;
  b.addEventListener("click", () => openViewer(p));
  grid.append(b);
});

function makeFilter(key, label, count) {
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("aria-pressed", key === "all");
  b.innerHTML = `${esc(label)}<span class="n">${count}</span>`;
  b.addEventListener("click", () => {
    filters.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    grid.querySelectorAll(".work").forEach(w => { w.hidden = key !== "all" && w.dataset.cat !== key; });
  });
  filters.append(b);
}
makeFilter("all", "전체", PROJECTS.length);
Object.entries(CATEGORIES).forEach(([k, label]) => {
  const n = PROJECTS.filter(p => p.category === k).length;
  if (n) makeFilter(k, label, n);
});

/* ---------- 작품 팝업 ---------- */
const viewer = $("#viewer"), vc = $("#viewerContent");
function openViewer(p) {
  vc.innerHTML = `
    <div class="viewer-head">
      <h3 id="vTitle">${esc(p.title)}</h3>
      ${p.tagline ? `<p class="tagline">${esc(p.tagline)}</p>` : ""}
    </div>
    <div class="viewer-body">
      <div>
        ${(p.desc || []).map(t => `<p>${esc(t)}</p>`).join("")}
        ${p.steps ? `<ol class="steps">${p.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}
      </div>
      <dl>${(p.info || []).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}<dt>연도</dt><dd>${esc(p.year)}</dd></dl>
    </div>
    <div class="gallery${p.galleryRow ? " row" : ""}">
      ${(p.images || []).map(([src, cap]) => `<figure><img src="${esc(src)}" alt="${esc(cap)}" loading="lazy"><figcaption>${esc(cap)}</figcaption></figure>`).join("")}
    </div>`;
  const v = videoFor(p.video, true);
  if (v) {
    const box = document.createElement("div");
    box.className = "viewer-video" + (p.vertical ? " vertical" : "");
    box.append(v); vc.prepend(box);
  }
  viewer.showModal(); viewer.scrollTop = 0;
}
viewer.addEventListener("close", () => { vc.innerHTML = ""; }); // 닫으면 영상 정지
$("#viewerClose").addEventListener("click", () => viewer.close());
viewer.addEventListener("click", e => { if (e.target === viewer) viewer.close(); });

/* ---------- SHOWREEL ---------- */
const reelEl = videoFor(SITE.reel);
if (reelEl) { $("#reel").append(reelEl); $("#reelNote").textContent = SITE.reelNote; }
else { $("#showreel").remove(); $("#navReel").remove(); }   // 쇼릴이 없으면 섹션과 메뉴를 숨김

/* ---------- ABOUT ---------- */
$("#profileImg").src = SITE.profile;
$("#aboutLead").textContent = SITE.lead;
$("#aboutIntro").textContent = SITE.intro;
$("#facts").innerHTML = SITE.facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
$("#tools").innerHTML = SITE.tools.map(([n, lv]) => `<li>${esc(n)}${SITE.showLevels
  ? `<span class="dots" role="img" aria-label="5단계 중 ${lv}">${[1,2,3,4,5].map(i => `<i class="${i <= lv ? "on" : ""}"></i>`).join("")}</span>` : ""}</li>`).join("");
$("#certs").innerHTML = SITE.certificates.map(c => `<li>${esc(c)}</li>`).join("");
const ex = SITE.experience;
$("#exp").innerHTML = ex ? `<h3>경험</h3><h4>${esc(ex.title)}</h4><p class="when">${esc(ex.when)}</p><p>${esc(ex.text)}</p>
  <ul>${ex.tasks.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : "";
$("#mail").textContent = SITE.email; $("#mail").href = "mailto:" + SITE.email;
$("#links").innerHTML = SITE.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
$("#year").textContent = new Date().getFullYear();

/* ---------- HOME ---------- */
const heroMedia = $("#heroMedia");
if (SITE.heroVideo) {
  const v = document.createElement("video");
  Object.assign(v, { src: SITE.heroVideo, muted: true, loop: true, playsInline: true, autoplay: !reduceMotion });
  v.addEventListener("error", () => v.remove());
  heroMedia.append(v);
} else if (SITE.heroImage) {
  const img = new Image(); img.src = SITE.heroImage; img.alt = "";
  img.addEventListener("error", () => img.remove());
  heroMedia.append(img);
}

/* 이름 길이에 맞춰 큰 글자 크기 자동 조절 */
const word = $("#heroWord");
function fitWord() {
  word.style.fontSize = "";
  const max = innerWidth * 0.94, w = word.scrollWidth;
  if (w > max) word.style.fontSize = parseFloat(getComputedStyle(word).fontSize) * max / w + "px";
}
document.fonts.ready.then(fitWord); addEventListener("resize", fitWord); fitWord();

/* 스크롤하면 글자 마스크가 걷히며 영상(이미지)이 화면 가득 */
const hero = $("#home"), mask = $("#heroMask"), meta = $("#heroMeta");
function onScroll() {
  if (reduceMotion) return;
  const r = hero.getBoundingClientRect();
  const p = Math.min(Math.max(-r.top / (r.height - innerHeight), 0), 1);
  mask.style.transform = `scale(${1 + p * 0.8})`;
  mask.style.opacity = 1 - Math.min(p * 1.4, 1);
  meta.style.opacity = 1 - Math.min(p * 3, 1);
}
addEventListener("scroll", () => requestAnimationFrame(onScroll), { passive: true });
onScroll();
</script>
</body>
